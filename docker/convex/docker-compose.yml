# Backend Convex autoalojado para desarrollo local.
#
# Copia del docker-compose.yml oficial de get-convex/convex-backend con los
# puertos FIJOS a propósito: la plantilla original los interpola con
# `${PORT:-3210}`, y basta con que el entorno tenga un `PORT` definido (p. ej.
# `PORT=0`) para que Docker publique el backend en un puerto aleatorio y ni el
# CLI de Convex ni la app lo encuentren. Aquí no hay nada que configurar:
#
#   backend    → http://127.0.0.1:3210   (API de Convex, clientes y CLI)
#   http actions → http://127.0.0.1:3211  (Convex Auth, webhooks)
#   dashboard  → http://localhost:6791   (panel de administración)
#
# Uso:  docker compose -f docker/convex/docker-compose.yml up -d
services:
  backend:
    # Cambia a :${REV} si quieres fijar una versión concreta.
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"
    extra_hosts:
      # El relevo de correo (`npm run mail:relay`) corre en el ordenador, no en
      # este contenedor: con esto el backend lo alcanza como
      # `http://host.docker.internal:8788/enviar` también en Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/convex/data
    environment:
      - V8_ACTION_USER_TIMEOUT_SECS
      - NODE_ACTION_USER_TIMEOUT_SECS
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS=${APPLICATION_MAX_CONCURRENT_NODE_ACTIONS:-16}
      - APPLICATION_MAX_CONCURRENT_QUERIES=${APPLICATION_MAX_CONCURRENT_QUERIES:-16}
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS=${APPLICATION_MAX_CONCURRENT_V8_ACTIONS:-16}
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:3210
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      - DATABASE_URL
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - MYSQL_URL
      - POSTGRES_URL
      - REDACT_LOGS_TO_CLIENT
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
    healthcheck:
      # Lo que se mira aquí es que el **contenedor** esté vivo, y eso se
      # pregunta al backend, que existe antes de que haya funciones desplegadas
      # (`/version` es suyo y no del código de la app).
      #
      # Las sondas del taller —`/healthz` y `/readyz`— las sirve el código ya
      # desplegado, en el *site origin* (`http://127.0.0.1:3211`), no en el
      # 3210: usarlas aquí dejaría el contenedor «unhealthy» hasta que el CLI
      # subiera las funciones, y `dashboard` y el propio arranque no llegarían a
      # esperar a un backend que sí está bien. Para Nginx, Proxmox o un monitor
      # externo, la sonda es `curl -f http://127.0.0.1:3211/healthz`.
      test: curl -f http://localhost:3210/version
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:3210
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
