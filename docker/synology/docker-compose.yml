# Pulso Taller en un NAS Synology (Container Manager).
#
# Cuatro contenedores se quedan y uno pasa:
#
#   app        la aplicación: se construye aquí dentro desde el código de
#              `./codigo` (mismo Dockerfile) y nginx sirve el resultado
#   backend    la API de Convex, la base de datos y el almacén de archivos
#   dashboard  el panel de administración de Convex (para el taller, no para quien usa la app)
#   vigilante  mira `src/convex` y vuelve a subir las funciones cuando cambian,
#              así que un cambio llega sin reiniciar ni reconstruir el proyecto
#   funciones  sube el esquema y las funciones al arrancar y se va
#              (no queda corriendo; mira su comentario más abajo)
#
# Antes de arrancar hay que rellenar `.env`, en esta misma carpeta:
#
#   INSTANCE_SECRET       una cadena secreta larga (no se cambia nunca)
#   CONVEX_CLOUD_ORIGIN   la dirección pública de la API (https://api.tudominio.com)
#   SITE_URL              la dirección pública de la app (https://taller.tudominio.com)
#   CONVEX_ADMIN_KEY      la clave de administrador, que se pide al backend la
#                         primera vez (paso 5 de la guía)
#
# Las tres primeras se rellenan de una vez, copiando `docker/synology/.env.example`.
# La cuarta no se puede saber hasta que el backend haya arrancado.
#
# La aplicación también necesita saber esa dirección, y la recibe al construirse
# (`VITE_CONVEX_URL`, con este mismo valor): la graba dentro del sitio, así que
# cambiarla es reconstruir el proyecto —un botón de Container Manager, sin copiar
# nada a mano—. Está contado en la guía:
# `../../SYNOLOGY.md`.
#
# Los puertos se publican solo en 127.0.0.1 (el propio NAS): quien entra desde
# fuera lo hace por el proxy inverso de DSM, que es quien pone el HTTPS. En la
# variante sin proxy —solo red local— hay que publicarlos en la LAN: mira los
# comentarios de cada `ports`.
#
# Uso (por SSH, en esta carpeta):
#   sudo docker compose up -d --build
#   sudo docker compose logs -f backend
#
# En Container Manager: **Project → Build** después de actualizar `codigo/`; el
# botón de arrancar levanta lo construido, con los datos del volumen intactos.

services:
  app:
    # La imagen se construye en el propio NAS, desde el código que hay en
    # `./codigo`; la receta —`docker/synology/Dockerfile`— la trae el
    # repositorio. Compilar aquí tiene una ventaja callada: la imagen sale para la
    # arquitectura del NAS, sea la que sea.
    #
    # El mismo Dockerfile construye también las imágenes de `funciones` y del
    # `vigilante`: las tres comparten la fase en la que se instalan las
    # dependencias, así que `npm ci` se paga una vez y no tres.
    #
    # `./codigo` es relativo a **esta** carpeta, la del proyecto en el NAS: este
    # archivo se copia allí junto al `.env` y el proyecto se deja al lado, en
    # `codigo/` (paso 3 de la guía). Por eso desde el repositorio este contexto no
    # existe: aquí se construye con la orden del `Dockerfile`.
    build:
      context: ./codigo
      dockerfile: docker/synology/Dockerfile
      # Del mismo Dockerfile salen dos imágenes (el sitio y el que sube las
      # funciones); aquí se pide la del sitio: nginx con lo compilado dentro.
      target: app
      args:
        # La misma dirección que usa el backend: un solo valor en el `.env` que
        # mantener, en lugar de dos que se puedan separar sin querer.
        VITE_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:?falta CONVEX_CLOUD_ORIGIN en el .env}
    # El nombre con el que queda construida: es la que se vuelve a levantar al
    # reconstruir, y la que se ve en Container Manager → Imagen.
    image: pulso-taller-app:local
    restart: unless-stopped
    ports:
      # Solo el NAS: el proxy inverso de DSM entra por aquí. Para servir la app
      # directamente en la red local, cambia esta línea por "8080:80" (y mira el
      # apartado «sin dominio» de la guía: la API también tiene que salir).
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      start_period: 5s
      retries: 5

  backend:
    # Cambia `:latest` por `:${REV}` si quieres fijar una versión concreta; con
    # `latest` hay que actualizar a mano y mirar los apuntes de la versión.
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      # El nombre de la instancia y su secreto. El secreto se genera una vez con
      # `openssl rand -hex 32` y no se cambia: al rotarlo se invalidan las claves
      # de administrador y las sesiones abiertas.
      - INSTANCE_NAME=${INSTANCE_NAME:-pulso-taller}
      - INSTANCE_SECRET=${INSTANCE_SECRET:?falta INSTANCE_SECRET en el .env}
      # La dirección pública de la API. No es solo para que la encuentren los
      # navegadores: las direcciones de los archivos que sirve el backend (fotos y
      # documentos del expediente) se construyen con ella, así que tiene que ser
      # la que alcanza quien usa la app.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:?falta CONVEX_CLOUD_ORIGIN en el .env}
      # Las «acciones HTTP» (por donde Convex Auth publica sus claves y valida las
      # sesiones con el proveedor de identidad del proyecto) no las pide ningún
      # navegador: se las pide el propio backend, así que se queda en su propia
      # máquina y no hay que publicar el 3211 ni ponerle HTTPS. Es el mismo valor
      # que usa el entorno local del repositorio.
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:3211
      # Nada de telemetría: el balance de uso no tiene por qué salir de casa.
      - DISABLE_BEACON=true
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - RUST_LOG=${RUST_LOG:-info}
    ports:
      # Solo el NAS: el proxy inverso publica esta API en su subdominio, con
      # HTTPS y con el WebSocket permitido. Para la variante sin proxy, cambia la
      # línea por "3210:3210" y pon en CONVEX_CLOUD_ORIGIN la dirección local
      # (http://192.168.x.x:3210).
      - "127.0.0.1:3210:3210"
    volumes:
      # Todo el estado: base de datos, archivos subidos y funciones desplegadas.
      - datos:/convex/data
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 30s
      start_period: 20s
      retries: 5

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    ports:
      # El panel lo abre el taller desde su red: http://IP-del-NAS:6791. No se
      # publica hacia fuera.
      - "127.0.0.1:6791:6791"
    environment:
      # El panel también es una web que habla con la API, así que usa la misma
      # dirección pública que la app.
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN}
    depends_on:
      backend:
        condition: service_healthy

  funciones:
    # Las funciones de la app, subidas desde el propio NAS al arrancar: no hace
    # falta ningún ordenador ni dejar el despliegue a mano cada vez que se toca
    # una función. Lo que sí hay que hacer una vez —la primera— es pedirle la
    # clave de administrador al backend y dejarla en el `.env`; sin ella este
    # contenedor sale diciendo de dónde sacarla.
    #
    # Este contenedor **no se queda corriendo**: sube el código y termina. Se ve
    # en Container Manager como detenido, y eso es lo correcto. `no` en
    # `restart` es a propósito: si falla, se debe poder arreglar y volver a
    # levantarlo a mano (`sudo docker compose up funciones`) en lugar de que el
    # NAS lo reintente en bucle sin decir nada.
    #
    # Antes de irse deja hecha la **cuenta de administrador** de una instalación
    # nueva: la base arranca vacía —sin datos de ejemplo— y esa cuenta es lo
    # único que hay dentro. Solo actúa si no hay ninguna cuenta; el detalle está
    # en `funciones-lib.sh`.
    #
    # El que se queda vigilando es `vigilante`, aquí debajo: los dos salen de la
    # misma imagen y se reparten el trabajo —este el primer envío, ese los demás—.
    build:
      context: ./codigo
      dockerfile: docker/synology/Dockerfile
      target: funciones
    image: pulso-taller-funciones:local
    restart: "no"
    environment:
      # A dónde sube: la dirección **exterior** de la API, la misma que usa la
      # app. El CLI la persigue hasta la boca del proxy inverso, así que el HTTPS
      # de DSM hace falta que ya funcione cuando esto arranca (y el WebSocket no,
      # para una subida no se usa).
      CONVEX_SELF_HOSTED_URL: ${CONVEX_CLOUD_ORIGIN:?falta CONVEX_CLOUD_ORIGIN en el .env}
      # La clave de administrador del backend. Es la única del `.env` que no se
      # puede saber de antemano —la pide al backend, que la firma con el secreto
      # de la instancia—, así que aquí no se exige: sin ella el contenedor sale
      # diciendo cómo obtenerla, y con ella sube las funciones. Es el paso 5 de
      # la guía, y solo se hace una vez.
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_ADMIN_KEY:-}
      # Las que leen las funciones dentro del deployment. El guion las deja
      # puestas antes de subir el código, y el despliegue avisa si falta alguna.
      SITE_URL: ${SITE_URL:?falta SITE_URL en el .env}
      VLY_CONVEX_AUTH_ISSUER: ${VLY_CONVEX_AUTH_ISSUER:-https://freebuff.com}
      # Solo si el taller usa las integraciones de la plataforma (el código por
      # email y el resumen semanal).
      VLY_INTEGRATION_KEY: ${VLY_INTEGRATION_KEY:-}
      VLY_INTEGRATION_BASE_URL: ${VLY_INTEGRATION_BASE_URL:-}
      # El **modo de instalación**. Con una base recién hecha —sin ninguna
      # cuenta— el taller queda listo de una sola pasada: la base vacía y la
      # cuenta de administrador ya creada, sin cargar ningún dato de ejemplo. Con
      # `no` no se toca ninguna cuenta: el primero que se registre pasa a ser
      # administrador, como antes.
      PULSO_INSTALL: ${PULSO_INSTALL:-empty}
      # Las credenciales de esa cuenta. Si van vacías se usan las de la guía
      # (admin@taller.es / admin12345); cámbialas antes de la primera puesta en
      # marcha si el taller va a estar publicado en internet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      # Y en el backend, para no intentarlo antes de que esté escuchando. El NAS
      # arranca los dos al encender: primero el backend, luego este, que sube y
      # se va.
      backend:
        condition: service_healthy

  vigilante:
    # El que se queda: mira `src/convex` y, cuando cambia algo, vuelve a subir el
    # esquema y las funciones. Es lo que hace que un cambio llegue **sin
    # reiniciar ni reconstruir el proyecto**: ni Container Manager ni el botón de
    # arrancar, nada. Lo que mira es el código que hay en el NAS —`./codigo/src/convex`,
    # montado dentro del contenedor—, así que da igual cómo haya llegado el
    # cambio: `npm run nas` desde el ordenador, un `git pull` en el NAS o un
    # archivo tocado por SSH.
    #
    # Es la misma imagen que `funciones` —salen de la misma fase del Dockerfile—
    # con otra orden: en lugar de subir una vez y marcharse, vigila. Están los dos
    # a propósito: `funciones` se encarga del primer envío al arrancar y este de
    # los siguientes, así que nunca coinciden subiendo a la vez —ni escribiendo en
    # el deployment: las variables y las claves de Convex Auth las pone el
    # arranque, y este las espera—. Y por eso mismo este **no sube nada al
    # arrancar**: lo que hace es apuntar cómo está el código y esperar a que
    # cambie.
    #
    # `on-failure:3` es a propósito: si el problema es de configuración —falta la
    # clave de administrador, el deployment no contesta—, lo cuenta y se para
    # pasados unos intentos, en vez de quedarse reintentando en bucle sin decir
    # por qué. Lo que falla de verdad, se arregla en los registros.
    build:
      context: ./codigo
      dockerfile: docker/synology/Dockerfile
      target: funciones
    image: pulso-taller-funciones:local
    # La orden que trae la imagen es la del arranque; el vigilante es el otro
    # guion de dentro de la misma imagen.
    command: ["/usr/local/bin/vigila-funciones"]
    restart: "on-failure:3"
    volumes:
      # El código de las funciones, tal cual está en el NAS. Va montado y no
      # metido en la imagen: dentro de la imagen está la versión de cuando se
      # construyó, y lo que hay que vigilar es lo que hay ahora mismo.
      #
      # Se monta en escritura porque el CLI de Convex deja ahí sus archivos
      # generados (`src/convex/_generated`), igual que en el entorno local. Esos
      # archivos no cuentan para la huella que decide si algo ha cambiado: si
      # contaran, cada subida dispararía la siguiente.
      - ./codigo/src/convex:/app/src/convex
    environment:
      # Las mismas que `funciones`, y por lo mismo: a dónde sube, con qué clave y
      # qué variables lleva el deployment. Mira allí el detalle de cada una.
      #
      # De dónde salen esas variables no es cosa de este contenedor: aquí no se
      # escribe ninguna. Las deja puestas `funciones`, que arranca a la vez que
      # este, y el vigilante espera a que estén (si escribieran los dos a la vez,
      # el que llegara segundo se llevaría un 503 del backend y el arranque se
      # caería). Si lo que cambia es el `.env`, quien lo lleva al deployment es
      # el arranque: `sudo docker compose up -d funciones`.
      CONVEX_SELF_HOSTED_URL: ${CONVEX_CLOUD_ORIGIN:?falta CONVEX_CLOUD_ORIGIN en el .env}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_ADMIN_KEY:-}
      SITE_URL: ${SITE_URL:?falta SITE_URL en el .env}
      VLY_CONVEX_AUTH_ISSUER: ${VLY_CONVEX_AUTH_ISSUER:-https://freebuff.com}
      VLY_INTEGRATION_KEY: ${VLY_INTEGRATION_KEY:-}
      VLY_INTEGRATION_BASE_URL: ${VLY_INTEGRATION_BASE_URL:-}
    depends_on:
      # Como los otros: nada hasta que el backend esté escuchando. Se queda
      # levantado, así que este `depends_on` solo decide el orden del arranque.
      backend:
        condition: service_healthy

volumes:
  datos:
