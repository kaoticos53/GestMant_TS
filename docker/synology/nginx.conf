# El servidor de la aplicación: sirve el sitio construido y nada más.
#
# La app enruta en el navegador (React Router): `/dashboard`, `/auth` o
# `/reportar` no son archivos, son rutas, así que cualquier dirección que no
# corresponda a un archivo devuelve el `index.html` y el navegador decide. Sin
# esa última línea, entrar directo a `/dashboard` daría un 404.
#
# El HTTPS no se configura aquí: lo pone el proxy inverso de DSM delante (esta es
# la parte de dentro, en HTTP y solo para el propio NAS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los archivos que genera Vite llevan un hash en el nombre, así que un archivo
    # concreto no cambia nunca: se pueden cachear a lo grande sin miedo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El índice sí cambia (es el que apunta a los archivos nuevos): siempre a la
    # última, o una actualización no se vería hasta recargar a lo bruto.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
        application/wasm image/svg+xml;

    # Cabeceras defensivas de seguridad HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
