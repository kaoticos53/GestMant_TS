# Cabeceras defensivas de seguridad HTTP compartidas entre `server` y los
# bloques `location` que definen su propia `add_header Cache-Control` (en nginx,
# declarar `add_header` en un `location` anula las cabeceras heredadas del bloque
# superior).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.convex.cloud __PULSO_API_IMG_SRC__; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://challenges.cloudflare.com __PULSO_API_CONNECT_SRC__; frame-ancestors 'none';" always;

