<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Chasis y Carcasa de Equipo Técnico Broadcast -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Pantalla / Monitor de Control Broadcast -->
  <rect x="44" y="44" width="424" height="424" rx="64" fill="#070c16" stroke="#162235" stroke-width="4"/>

  <!-- Retícula de Encuadre Safe-Area (Esquinas de Monitor de Estudio) -->
  <path d="M 80 120 L 80 80 L 120 80" fill="none" stroke="#2a3b53" stroke-width="4" stroke-linecap="round"/>
  <path d="M 432 120 L 432 80 L 392 80" fill="none" stroke="#2a3b53" stroke-width="4" stroke-linecap="round"/>
  <path d="M 80 392 L 80 432 L 120 432" fill="none" stroke="#2a3b53" stroke-width="4" stroke-linecap="round"/>
  <path d="M 432 392 L 432 432 L 392 432" fill="none" stroke="#2a3b53" stroke-width="4" stroke-linecap="round"/>

  <!-- Barras de Calibración de Test SMPTE de Emisión -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="10" height="18" fill="#e2e8f0" rx="2"/>
    <rect x="13" y="0" width="10" height="18" fill="#eab308" rx="2"/>
    <rect x="26" y="0" width="10" height="18" fill="#06b6d4" rx="2"/>
    <rect x="39" y="0" width="10" height="18" fill="#22c55e" rx="2"/>
    <rect x="52" y="0" width="10" height="18" fill="#ec4899" rx="2"/>
    <rect x="65" y="0" width="10" height="18" fill="#ef4444" rx="2"/>
    <rect x="78" y="0" width="10" height="18" fill="#3b82f6" rx="2"/>
  </g>

  <!-- Indicador Tally On-Air de Plató / Control Central -->
  <g transform="translate(372, 98)">
    <circle cx="16" cy="10" r="9" fill="url(#accentGrad)" filter="url(#glow)"/>
    <circle cx="16" cy="10" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Retícula de Osciloscopio Central -->
  <line x1="80" y1="264" x2="432" y2="264" stroke="#131e2e" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="256" y1="140" x2="256" y2="390" stroke="#131e2e" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- Detalle técnico de herramientas de taller -->
  <g stroke="#1a273a" stroke-width="5" stroke-linecap="round">
    <path d="M 180 340 L 210 310" />
    <path d="M 302 218 L 332 188" />
  </g>

  <!-- Pulso de Onda Broadcast (Sync Waveform) -->
  <path d="M 90 264 L 170 264 L 205 210 L 235 325 L 265 170 L 295 345 L 325 240 L 350 264 L 422 264"
        fill="none" stroke="#06b6d4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#glow)"/>

  <path d="M 90 264 L 170 264 L 205 210 L 235 325 L 265 170 L 295 345 L 325 240 L 350 264 L 422 264"
        fill="none" stroke="url(#signalGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nodos de calibración de señal -->
  <circle cx="265" cy="170" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="295" cy="345" r="5" fill="#38bdf8"/>
  <circle cx="235" cy="325" r="5" fill="#22d3ee"/>

  <!-- Badge técnico inferior -->
  <g transform="translate(146, 396)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0d1726" stroke="#1e2e47" stroke-width="2"/>
    <circle cx="16" cy="13" r="4" fill="#06b6d4"/>
    <text x="32" y="17" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PULSO TALLER</text>
  </g>
</svg>
